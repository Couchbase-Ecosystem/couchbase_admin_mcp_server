[project]
name = "couchbase-admin-mcp-server"
version = "1.0.0"
description = "Couchbase Admin MCP Server — cluster administration and operations as MCP tools, for self-managed Couchbase Server and Couchbase Capella"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Couchbase, Inc." },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
]

dependencies = [
    # UPPER BOUND IS LOAD-BEARING, and the reason is NOT the one first assumed.
    #
    # The Tool model's field renames (inputSchema -> input_schema, and the annotation
    # hints likewise) turned out to be the easy half, and mcp_compat.py now handles both
    # spellings. Construction was never affected at all: 2.x keeps the camelCase names as
    # pydantic aliases, so the ~150 Tool(...) and ~360 ToolAnnotations(...) calls here work
    # unchanged. Only nineteen attribute READS broke.
    #
    # What actually blocks 2.x is the SERVER API:
    #
    #   * lowlevel.Server lost the decorator registry entirely. `@app.list_tools()` and
    #     `@app.call_tool()` are gone in favour of add_request_handler(method, params_type,
    #     handler), and the runner now owns `initialize`.
    #   * mcp.server.lowlevel.server.request_ctx NO LONGER EXISTS. That contextvar is how
    #     auth/request_auth.py resolves the caller's validated claims INSIDE the dispatch
    #     task, which is the whole mechanism that makes HTTP authorization work here — see
    #     the account in that module of why nothing else does. 2.x offers
    #     ServerRequestContext and a request_state module instead.
    #   * The HTTP transport wiring differs: Server.session_manager and
    #     Server.streamable_http_app replace the StreamableHTTPSessionManager assembly in
    #     server._main_http.
    #
    # So the port is a re-implementation of the authorization path, not an adaptation, and
    # it needs the same adversarial review the current one got. Until then, pinning below
    # 2.0 is the honest position: a range that resolves to a version the server cannot run
    # is worse than a narrow one.
    "mcp>=1.10,<2.0",
    "couchbase>=4.4.0,<5.0.0",
]

[project.optional-dependencies]
http = [
    "uvicorn>=0.27",
    "starlette>=0.35",
]
gui = [
    "flask>=3.0",
    "flask-cors>=6.0.0",
]
oauth = [
    "flask>=3.0",
    "flask-cors>=6.0.0",
    "PyJWT[crypto]>=2.8.0",
    "cryptography>=44.0.1",
    "requests>=2.32.4",
]
dev = [
    "ruff==0.12.5",
    "pre-commit==4.2.0",
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-cov>=7.0.0",
    # The GUI's own dependencies belong in dev too. Without them the console's tests
    # were silently skipped by importorskip, which is how POST /api/call came to
    # diverge from the MCP dispatch twice: no scope check, no audit record, and a
    # hard-ceiling test that a caller-supplied `confirm: true` could satisfy.
    "flask>=3.0",
    "flask-cors>=6.0.0",
    # Same reasoning for the HTTP transport's live tests.
    "uvicorn>=0.27",
    "starlette>=0.35",
    # The deployment artifacts under deploy/ are ASSERTED ON, not just shipped:
    # tests/test_one_container_one_surface.py parses the compose files and fails
    # if the Capella one ever gains a CB_CONNECTION_STRING (which would resolve
    # the mode to 'both' and switch capability gating off). Without pyyaml those
    # tests error on import, and an erroring guard is an absent guard.
    "pyyaml>=6.0",
    # tomllib is stdlib on 3.11+; tomli is the same library, used as a fallback on 3.10
    "tomli>=2.0.0 ; python_version < '3.11'",
    # DECLARED, not inherited transitively. jsonschema, PyJWT and cryptography reached
    # the test environment only because `mcp` happened to depend on them, and `mcp`
    # changed: at the declared floor (mcp==1.10.0) neither pyjwt nor cryptography ships,
    # so the suite cannot run as tested. Removing cryptography silently SKIPS two TLS
    # tests via importorskip and errors two more files at collection -- a green run that
    # tested less than it appeared to.
    "jsonschema>=4.20",
    "PyJWT[crypto]>=2.8.0",
    "cryptography>=44.0.1",
    "requests>=2.32.4",
    # CI has a step named "Tests, in randomised order" which was NOT randomised,
    # because this was never declared or installed: the two test steps were
    # byte-identical and the order-dependence check the repo says it relies on did not
    # exist. It found a real one immediately -- a sys.modules.pop that silently
    # disabled six tests, two of them enterprise-profile security refusals.
    "pytest-randomly>=3.15",
]

[project.urls]
Homepage = "https://github.com/Couchbase-Ecosystem/couchbase_admin_mcp_server"
Issues = "https://github.com/Couchbase-Ecosystem/couchbase_admin_mcp_server/issues"

[project.scripts]
couchbase-admin-mcp-server = "server:main"

# ── Ruff ─────────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 88
target-version = "py310"

include = ["**/*.py"]
exclude = [
    ".bzr", ".direnv", ".eggs", ".git", ".git-rewrite", ".hg",
    ".ipynb_checkpoints", ".mypy_cache", ".nox", ".pants.d", ".pyenv",
    ".pytest_cache", ".pytype", ".ruff_cache", ".svn", ".tox", ".venv",
    "__pypackages__", "_build", "buck-out", "build", "dist",
    "node_modules", "site-packages", "venv",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "I",    # isort
    "N",    # pep8-naming
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie
    "PL",   # Pylint
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E501",    # Line too long (handled by formatter)
    "PLR0913", # Too many arguments
    "PLR2004", # Magic value used in comparison
    "PLR0911", # Too many return statements (expected in dispatch functions)
    "PLR0912", # Too many branches (expected in dispatch functions)
    "PLR0915", # Too many statements (expected in dispatch functions)
    "PLC0415", # Import not at top-level (intentional: lazy imports for optional deps)
    "PLW0603", # Using global statement (intentional: lazy connection pool)
    "PLW2901", # Loop variable overwritten (acceptable in our parsing helpers)
    "N806",    # Variable in function should be lowercase (SQL++ variables)
    "N803",    # Argument name should be lowercase (QueryOptions pass-through pattern)
    "N812",    # Lowercase imported as non-lowercase (SDK subdocument as SD)
    "B904",    # Use raise...from (minor; will fix in follow-up)
    "B007",    # Loop variable not used (minor; will fix in follow-up)
    "SIM102",  # Nested if (intentional readability choice in filter function)
    "SIM117",  # Nested with (intentional: async context manager nesting)
    "RUF022",  # __all__ is not sorted
    "UP038",   # Deprecated in ruff 0.10, removed in 0.13. The tuple form
               # isinstance(x, (A, B)) is actually ~2x faster than X | Y on
               # CPython 3.10-3.12, so the tuple form is preferred. Pinned
               # ruff 0.12.5 still emits it; explicit ignore is the fix.
]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["PLR2004", "N802"]
"**/config.py" = ["N802"]

[tool.ruff.lint.isort]
known-first-party = ["handlers", "auth", "logging_config"]
split-on-trailing-comma = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ── Pytest ────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
asyncio_mode = "strict"
markers = [
    # Boots a real uvicorn server and drives it over HTTP. Excluded with
    # -m "not live" where binding a local port is not available.
    "live: end-to-end tests against a live HTTP server",
]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

# ── Build ─────────────────────────────────────────────────────────────────────

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# gui is here because the console is part of the deliverable. The wheel previously
# contained only handlers and auth, so `pip install .` produced an installation with
# no console at all while the [gui] extra dutifully installed Flask for it.
packages = ["handlers", "auth", "gui"]

[tool.hatch.build.targets.wheel.force-include]
# Every top-level module server.py imports. audit.py, authz.py and profile_config.py
# were missing, so the installed console script raised ModuleNotFoundError on import
# — the wheel had the same defect as the container image.
#
# dryrun.py was missing for the same reason, one module later: it was added to
# server.py's imports without either shipping list being updated, and the two
# test_packaging tests reporting it were read as stale rather than as the defect
# they were. Adding a top-level module means editing THREE places — this list, the
# Dockerfile COPY block, and nothing else works.
"server.py" = "server.py"
"audit.py" = "audit.py"
"authz.py" = "authz.py"
"deployment.py" = "deployment.py"
"dryrun.py" = "dryrun.py"
"logging_config.py" = "logging_config.py"
"mcp_compat.py" = "mcp_compat.py"
"profile_config.py" = "profile_config.py"
"tls_config.py" = "tls_config.py"

[tool.uv]
package = true

# ── Coverage ──────────────────────────────────────────────────────────────────
#
# HERE rather than in .coveragerc, deliberately. A dotfile named `.coveragerc` is deleted by
# the `rm -f .coverage*` that everyone types to clear stale data files — I did it myself, in
# every measurement command, and spent a while wondering why the config had no effect.
# pyproject.toml cannot be removed by that glob.
#
# tests/test_coverage_config.py asserts these settings, because widening an exclusion raises
# the reported number without testing anything and looks like configuration housekeeping in a
# diff.

[tool.coverage.run]
source = ["."]
branch = false
omit = [
    "tests/*",
    # Test infrastructure: the mutation harnesses COPY the tree and run pytest in a
    # subprocess, so their own lines never execute in the process being measured.
    "scripts/mutation_*",
    # Vendored third-party JavaScript.
    "gui/static/*",
    ".venv/*",
]

[tool.coverage.report]
exclude_lines = [
    # The conventional opt-out, used sparingly and always with a stated reason at the site.
    "pragma: no cover",
    # Script entry points. Reaching these means running the module as a program, which the
    # packaging tests do in a SUBPROCESS — the lines execute, just not in the measured
    # process. Counting them as uncovered would misreport them as untested.
    "if __name__ == .__main__.:",
    # Type-checking-only imports never execute at runtime, by design.
    "if TYPE_CHECKING:",
    # `raise NotImplementedError` in an abstract position is a declaration, not a branch.
    "raise NotImplementedError",
]
precision = 0

# A REAL gate. This whole block, plus tests/test_coverage_config.py, previously
# constrained a measurement nothing performed: no CI job ran --cov and there was no
# fail_under, so the exclusions were pinned while the number they shape was never
# produced or checked. Set just under the measured 91% so ordinary churn does not
# break the build, while a genuine drop does.
fail_under = 89
show_missing = true
