[project]
name = "couchbase-admin-mcp-server"
version = "0.1.0"
description = "Couchbase Admin MCP Server — cluster administration and operations as MCP tools, for self-managed Couchbase Server and Couchbase Capella"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Couchbase, Inc." },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
]

dependencies = [
    # UPPER BOUND IS LOAD-BEARING, not caution.
    #
    # mcp 2.0 renamed the Tool model's fields: inputSchema -> input_schema, and the
    # annotation hints likewise. This codebase uses the 1.x names in 400+ places, so with
    # an unbounded ">=1.0.0" a fresh `pip install` resolved mcp 2.0.0 and the server died
    # on first use with:
    #
    #     AttributeError: 'Tool' object has no attribute 'inputSchema'
    #
    # The development environment had 1.29.0 and worked, so nothing surfaced it until a
    # CI job installed the built wheel into a clean virtualenv and imported from THAT
    # rather than from the source tree. Supporting 2.x needs a compatibility layer over
    # the Tool model; it is not a constraint change.
    "mcp>=1.10,<2.0",
    "couchbase>=4.4.0,<5.0.0",
]

[project.optional-dependencies]
http = [
    "uvicorn>=0.27",
    "starlette>=0.35",
]
gui = [
    "flask>=3.0",
    "flask-cors>=6.0.0",
]
oauth = [
    "flask>=3.0",
    "flask-cors>=6.0.0",
    "PyJWT[crypto]>=2.8.0",
    "cryptography>=44.0.1",
    "requests>=2.32.4",
]
dev = [
    "ruff==0.12.5",
    "pre-commit==4.2.0",
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-cov>=7.0.0",
    # The GUI's own dependencies belong in dev too. Without them the console's tests
    # were silently skipped by importorskip, which is how POST /api/call came to
    # diverge from the MCP dispatch twice: no scope check, no audit record, and a
    # hard-ceiling test that a caller-supplied `confirm: true` could satisfy.
    "flask>=3.0",
    "flask-cors>=6.0.0",
    # Same reasoning for the HTTP transport's live tests.
    "uvicorn>=0.27",
    "starlette>=0.35",
    # tomllib is stdlib on 3.11+; tomli is the same library, used as a fallback on 3.10
    "tomli>=2.0.0 ; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/Couchbase-Ecosystem/couchbase-admin-mcp-server"
Issues = "https://github.com/Couchbase-Ecosystem/couchbase-admin-mcp-server/issues"

[project.scripts]
couchbase-admin-mcp-server = "server:main"

# ── Ruff ─────────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 88
target-version = "py310"

include = ["**/*.py"]
exclude = [
    ".bzr", ".direnv", ".eggs", ".git", ".git-rewrite", ".hg",
    ".ipynb_checkpoints", ".mypy_cache", ".nox", ".pants.d", ".pyenv",
    ".pytest_cache", ".pytype", ".ruff_cache", ".svn", ".tox", ".venv",
    "__pypackages__", "_build", "buck-out", "build", "dist",
    "node_modules", "site-packages", "venv",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "I",    # isort
    "N",    # pep8-naming
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie
    "PL",   # Pylint
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E501",    # Line too long (handled by formatter)
    "PLR0913", # Too many arguments
    "PLR2004", # Magic value used in comparison
    "PLR0911", # Too many return statements (expected in dispatch functions)
    "PLR0912", # Too many branches (expected in dispatch functions)
    "PLR0915", # Too many statements (expected in dispatch functions)
    "PLC0415", # Import not at top-level (intentional: lazy imports for optional deps)
    "PLW0603", # Using global statement (intentional: lazy connection pool)
    "PLW2901", # Loop variable overwritten (acceptable in our parsing helpers)
    "N806",    # Variable in function should be lowercase (SQL++ variables)
    "N803",    # Argument name should be lowercase (QueryOptions pass-through pattern)
    "N812",    # Lowercase imported as non-lowercase (SDK subdocument as SD)
    "B904",    # Use raise...from (minor; will fix in follow-up)
    "B007",    # Loop variable not used (minor; will fix in follow-up)
    "SIM102",  # Nested if (intentional readability choice in filter function)
    "SIM117",  # Nested with (intentional: async context manager nesting)
    "RUF022",  # __all__ is not sorted
    "UP038",   # Deprecated in ruff 0.10, removed in 0.13. The tuple form
               # isinstance(x, (A, B)) is actually ~2x faster than X | Y on
               # CPython 3.10-3.12, so the tuple form is preferred. Pinned
               # ruff 0.12.5 still emits it; explicit ignore is the fix.
]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["PLR2004", "N802"]
"**/config.py" = ["N802"]

[tool.ruff.lint.isort]
known-first-party = ["handlers", "auth", "logging_config"]
split-on-trailing-comma = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ── Pytest ────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
asyncio_mode = "strict"
markers = [
    # Boots a real uvicorn server and drives it over HTTP. Excluded with
    # -m "not live" where binding a local port is not available.
    "live: end-to-end tests against a live HTTP server",
]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

# ── Build ─────────────────────────────────────────────────────────────────────

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# gui is here because the console is part of the deliverable. The wheel previously
# contained only handlers and auth, so `pip install .` produced an installation with
# no console at all while the [gui] extra dutifully installed Flask for it.
packages = ["handlers", "auth", "gui"]

[tool.hatch.build.targets.wheel.force-include]
# Every top-level module server.py imports. audit.py, authz.py and profile_config.py
# were missing, so the installed console script raised ModuleNotFoundError on import
# — the wheel had the same defect as the container image.
"server.py" = "server.py"
"audit.py" = "audit.py"
"authz.py" = "authz.py"
"deployment.py" = "deployment.py"
"logging_config.py" = "logging_config.py"
"profile_config.py" = "profile_config.py"
"tls_config.py" = "tls_config.py"

[tool.uv]
package = true
